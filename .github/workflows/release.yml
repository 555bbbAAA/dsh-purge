name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == '555bbbAAA/dsh-purge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax check plugin entry
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/reapply.js
          node --check lib/preflight.js
          node --check lib/uninstall.js
          node --input-type=module -e "import './lib/index.js'"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          # 幂等：release 已存在就跳过，不重发、不覆盖。
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::release ${tag} already exists, nothing to do"
            exit 0
          fi

          # 本仓库靠 GitHub contents API 逐文件推送（git push 长期 502），一次发版
          # 会落成好几个 commit，中间态必然出现「package.json 已是新版、
          # release-notes.md 还是旧版」这种半截状态。那不是错误，等后续 commit
          # 把两者补齐即可 —— 所以这里跳过而不是失败，避免刷一屏红色 Run failed。
          # 先去掉可能的 UTF-8 BOM 与 CRLF，否则首行比对会被 BOM 带偏。
          first="$(head -n 1 release-notes.md | tr -d '\r')"
          first="${first#$'\xef\xbb\xbf'}"
          if [ "$first" != "# ${version}" ]; then
            echo "::notice::package.json=${version} but release-notes.md starts with '${first}' — partial push in progress, skipping until they agree"
            exit 0
          fi

          zip="dsh-purge-${version}.zip"
          git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" HEAD
          test -s "$zip"

          # 2026-11-01：同时产出 npm tarball。历史发布都带 .tgz，但 CI 从来没打过，
          # 一直是本机 npm pack 后手工上传。npm pack 不需要 node_modules，只读
          # package.json 的 files 字段，CI 里直接跑即可。
          tgz="dsh-purge-${version}.tgz"
          npm pack --pack-destination . >/dev/null
          test -s "$tgz"

          # 2026-11-01：补 SHA256SUMS。历史发布都有这个资产，但 CI 从来没生成过，
          # 一直是手工补的。格式与手工版一致：<hex>  <filename>，zip 与 tgz 各一行。
          sums="SHA256SUMS-${version}"
          sha256sum "$zip" "$tgz" > "$sums"
          test -s "$sums"

          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md
          gh release upload "$tag" "$zip" "$tgz" "$sums" --clobber
          echo "published https://github.com/555bbbAAA/dsh-purge/releases/tag/${tag}"
          echo "assets: $zip ($(stat -c%s "$zip") bytes), $tgz ($(stat -c%s "$tgz") bytes), $sums"
          cat "$sums"
