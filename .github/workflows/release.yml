name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == '555bbbAAA/dsh-purge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax check plugin entry
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/reapply.js
          node --input-type=module -e "import './lib/index.js'"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "already published: $tag"
            exit 0
          fi
          first="$(head -n 1 release-notes.md | tr -d '\r')"
          if [ "$first" != "# ${version}" ]; then
            echo "release-notes first line must be # ${version}, got: ${first}"
            exit 1
          fi
          zip="dsh-purge-${version}.zip"
          git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" HEAD
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md
          test -s "$zip"
          gh release upload "$tag" "$zip" --clobber
          echo "published https://github.com/555bbbAAA/dsh-purge/releases/tag/${tag}"
